@baseTheme = light

# ==== COLORES BASE ====
background = #fff6ef
foreground = #5a3d39

# ==== COMPONENTES GENERALES ====
Component.arc = 8
Component.focusWidth = 2
Component.innerFocusWidth = 1
Component.borderColor = #97594c
Component.focusColor = #d57c5a

# ==== TEXTO ====
Label.foreground = #5a3d39
TextField.foreground = #5a3d39
TextField.background = #fff6ef
TextField.borderColor = #97594c
TextField.focusedBorderColor = #d57c5a

PasswordField.foreground = #5a3d39
PasswordField.background = #fff6ef

# ==== BOTONES ====
Button.background = #d57c5a
Button.foreground = #ffffff
Button.arc = 10
Button.borderWidth = 0
Button.focusedBackground = #eb9f75
Button.hoverBackground = #eb9f75
Button.pressedBackground = #97594c

# Botón por defecto (acciones importantes)
Button.default.background = #d57c5a
Button.default.foreground = #ffffff

# ==== PANELES ====
Panel.background = #fff6ef

# ==== TARJETAS / CONTENEDORES ====
# (FlatLaf usa Panel y otros componentes)
Component.background = #f6b87b

# ==== TABLAS ====
Table.background = #fff6ef
Table.foreground = #5a3d39
Table.selectionBackground = #f6b87b
Table.selectionForeground = #5a3d39
Table.gridColor = #97594c

# ==== LISTAS ====
List.background = #fff6ef
List.foreground = #5a3d39
List.selectionBackground = #f6b87b
List.selectionForeground = #5a3d39

# ==== MENÚS ====
MenuBar.background = #f6b87b
MenuBar.foreground = #5a3d39

Menu.background = #f6b87b
Menu.foreground = #5a3d39

MenuItem.background = #fff6ef
MenuItem.foreground = #5a3d39
MenuItem.selectionBackground = #eb9f75

# ==== TABS ====
TabbedPane.background = #fff6ef
TabbedPane.foreground = #5a3d39
TabbedPane.selectedBackground = #f6b87b
TabbedPane.underlineColor = #d57c5a

# ==== SCROLL ====
ScrollBar.thumb = #97594c
ScrollBar.track = #fff6ef

# ==== ALERTAS ====
Component.error.borderColor = #d12931
Component.error.focusedBorderColor = #d12931

# ==== CHECKBOX / RADIO ====
CheckBox.foreground = #5a3d39
RadioButton.foreground = #5a3d39

# ==== TOOLTIP ====
ToolTip.background = #f6b87b
ToolTip.foreground = #5a3d39

# ==== FUENTE ====
defaultFont = 14 "Segoe UI"